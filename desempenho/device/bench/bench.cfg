# Acrescentado por cima do retroarch.cfg do usuário só durante o benchmark.
# Tira os limitadores de velocidade e isola saves/estados do benchmark.
video_vsync = "false"
audio_sync = "false"
vrr_runloop_enable = "false"
fastforward_ratio = "0.000000"
config_save_on_exit = "false"
savefile_directory = "/home/ark/.local/share/r36s-perf/bench/saves"
savestate_directory = "/home/ark/.local/share/r36s-perf/bench/states"
savestate_auto_load = "false"
savestate_auto_save = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "true"
fps_show = "false"
rewind_enable = "false"
cheevos_enable = "false"
network_cmd_enable = "false"
# O retroarch.cfg do dArkOSRE grava saves/estados/screenshots ao lado da ROM;
# sem isto o benchmark escreveria .srm em /roms.
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
screenshots_in_content_dir = "false"
